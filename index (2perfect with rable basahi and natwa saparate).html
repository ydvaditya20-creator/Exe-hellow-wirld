                <th style="width: 25%;">Amount (₹)</th>
                <th style="width: 10%;">Action</th>
            </tr>
        </thead>
        <tbody id="entrySubBody"></tbody>
        <tfoot>
            <tr style="font-weight: bold; background: #eef2f3;">
                <td>Total</td>
                <td style="text-align: right;">Debit: <span id="totalDebit">0</span></td>
                <td colspan="2">Credit: <span id="totalCredit">0</span></td>
            </tr>
        </tfoot>
    </table>

    <div id="balanceStatus" class="status-box unbalanced">Unbalanced (Diff: 0)</div>
    
    <button type="button" class="btn btn-save" onclick="saveVoucher()">Save Voucher</button>

    <!-- SEPARATE TABLES FOR REPORT -->
    <h3 style="margin-top: 40px; color: var(--warning);">Basahi Voucher Register</h3>
  <button onclick="sendTableToSheet('basahiTable')">Export Natwa Table to Sheet</button>
 

  <table id="basahiTable">
        <thead>
            <tr>
                <th>Voucher No</th>
                <th>Date</th>
                <th>Type</th>
                <th>Accounts Involved</th>
                <th>Total Amount</th>
                <th>Narration</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="basahiBody"></tbody>
    </table>

    <h3 style="margin-top: 20px; color: var(--info);">Natwa Voucher Register</h3>
   <button onclick="sendTableToSheet('natwaTable')">Export Natwa Table to Sheet</button>
 

 <table id="natwaTable">
        <thead>
            <tr>
                <th>Voucher No</th>
                <th>Date</th>
                <th>Type</th>
                <th>Accounts Involved</th>
                <th>Total Amount</th>
                <th>Narration</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="natwaBody"></tbody>
    </table>
</div>

<datalist id="accountList">
    <option value="Cash Account">
    <option value="HDFC Bank Account">
    <option value="Sales Revenue Account">
    <option value="Purchase Account">
    <option value="Office Rent Expense">
    <option value="Salary Expense">
</datalist>

<div id="printArea"></div>

<script>  
// Purane let savedVouchers = []; ki jagah ye line likhein
let savedVouchers = JSON.parse(localStorage.getItem('vouchers')) || [];



let editModeVoucherId = null;
let currentClassification = "Basahi"; // Default state tracking

window.onload = function() {
    document.getElementById('voucherDate').valueAsDate = new Date();
    generateUniqueVoucherNo();
    addGridRow();
    addGridRow();

// Ise window.onload ke andar sabse niche jod dein
renderHistoryTables();

}
function sendTableToSheet(tableId) {
            // YAHAN APNA APPS SCRIPT WEB APP URL PASTE KAREIN
            const webAppUrl = "https://script.google.com/macros/s/AKfycbzMLraZcirFbs-oOhgdwnXAoM3AYYNug-_Y5EAEZ9OIlEPGqAvW8CqeCPXXuty9h58W9w/exec"; 
            
            const table = document.getElementById(tableId);
            if (!table) {
                alert("Table nahi mila!");
                return;
            }

            const rowsData = [];
            const rows = table.querySelectorAll("tr");

            // Table ki har row se data nikalna
            rows.forEach(row => {
                const cols = row.querySelectorAll("th, td");
                const rowData = [];
                cols.forEach(col => {
                    rowData.push(col.innerText.trim());
                });
                rowsData.push(rowData);
            });

            // Google App Script ko bheja jaane wala data object
            const payload = {
                sheetName: tableId, // Id hi hamare sheet ka naam (tab name) hai
                rows: rowsData
            };

            // Loader ya alert show karna
            alert(`${tableId} table ka data Google Sheet me bheja ja raha hai...`);

            // Fetch API ke zariye Google Sheet script ko POST request bhejna
            fetch(webAppUrl, {
                method: "POST",
                mode: "no-cors", // Google Apps Script redirects ko handle karne ke liye no-cors zaroori hai
                cache: "no-cache",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert(`Data kamyabi se '${tableId}' tab me add ho gaya hai!`);
            })
            .catch(error => {
                console.error("Error:", error);
                alert("Data bhejne me koi dikkat aayi.");
            });
        }

// Toggle logic between Basahi and Natwa
function toggleClassification() {
    const btn = document.getElementById('classificationBtn');
    if (currentClassification === "Basahi") {
        currentClassification = "Natwa";
        btn.innerText = "Natwa";
        btn.classList.add('natwa');
    } else {
        currentClassification = "Basahi";
        btn.innerText = "Basahi";
        btn.classList.remove('natwa');
    }
}

function generateUniqueVoucherNo() {
    if(editModeVoucherId) return; 
    const dateInput = document.getElementById('voucherDate').value.replace(/-/g, "");
    const now = new Date();
    const timePart = String(now.getHours()).padStart(2, '0') + 
                     String(now.getMinutes()).padStart(2, '0') + 
                     String(now.getSeconds()).padStart(2, '0') + 
                     String(now.getMilliseconds()).padStart(3, '0');
    document.getElementById('voucherNo').value = `V-${dateInput}-${timePart}`;
}

function addGridRow(acc = '', type = 'Debit', amt = '') {
    const tbody = document.getElementById('entrySubBody');
    const row = document.createElement('tr');
    row.className = 'entry-row';
    row.innerHTML = `
        <td><input type="text" class="grid-acc" list="accountList" value="${acc}" placeholder="Type Account" style="width:90%"></td>
        <td>
            <select class="grid-type" onchange="calculateTotals()">
                <option value="Debit" ${type === 'Debit' ? 'selected' : ''}>Debit</option>
                <option value="Credit" ${type === 'Credit' ? 'selected' : ''}>Credit</option>
            </select>
        </td>
        <td><input type="number" class="grid-amt" value="${amt}" oninput="calculateTotals()" placeholder="0.00" style="width:90%"></td>
        <td><button type="button" class="btn btn-delete" onclick="removeGridRow(this)">X</button></td>
    `;
    tbody.appendChild(row);
    calculateTotals();
}

function removeGridRow(btn) {
    btn.parentNode.parentNode.remove();
    calculateTotals();
}

function calculateTotals() {
    let debitTotal = 0, creditTotal = 0;
    document.querySelectorAll('.entry-row').forEach(row => {
        const type = row.querySelector('.grid-type').value;
        const amt = parseFloat(row.querySelector('.grid-amt').value) || 0;
        if(type === 'Debit') debitTotal += amt; else creditTotal += amt;
    });
    document.getElementById('totalDebit').innerText = debitTotal.toFixed(2);
    document.getElementById('totalCredit').innerText = creditTotal.toFixed(2);
    const statusBox = document.getElementById('balanceStatus');
    if(debitTotal === creditTotal && debitTotal > 0) {
        statusBox.className = "status-box balanced";
        statusBox.innerText = `Balanced (Total: ₹${debitTotal.toFixed(2)})`;
        return true;
    } else {
        statusBox.className = "status-box unbalanced";
        statusBox.innerText = `Unbalanced (Diff: ₹${Math.abs(debitTotal - creditTotal).toFixed(2)})`;
        return false;
    }
}

function saveVoucher() {
    if(!calculateTotals()) {
        alert("Error: Voucher unbalanced hai!");
        return;
    }

    const vNo = document.getElementById('voucherNo').value;
    const vDate = document.getElementById('voucherDate').value;
    const vType = document.getElementById('voucherType').value;
    const narration = document.getElementById('narration').value;

    let items = [];
    let accountSummary = [];
    document.querySelectorAll('.entry-row').forEach(row => {
        const acc = row.querySelector('.grid-acc').value;
        const type = row.querySelector('.grid-type').value;
        const amt = parseFloat(row.querySelector('.grid-amt').value) || 0;
        if(acc && amt > 0) {
            items.push({ account: acc, type: type, amount: amt });
            accountSummary.push(`${acc} (${type}: ₹${amt})`);
        }
    });

    if(items.length < 2) { return alert("Kam se kam do accounts enter karein."); }

    const voucherData = {
        id: editModeVoucherId || vNo,
        vNo: vNo,
        vDate: vDate,
        vType: vType,
        narration: narration,
        items: items,
        summary: accountSummary.join(', '),
        total: parseFloat(document.getElementById('totalDebit').innerText),
        classification: currentClassification // Saves under Basahi or Natwa
    };

    if(editModeVoucherId) {
        const index = savedVouchers.findIndex(v => v.id === editModeVoucherId);
        savedVouchers[index] = voucherData;
        editModeVoucherId = null;
    } else {
        savedVouchers.push(voucherData);
    }

    document.getElementById('narration').value = '';
    document.getElementById('entrySubBody').innerHTML = '';
    addGridRow(); addGridRow();
    generateUniqueVoucherNo();
    renderHistoryTables();
// Data save karne ke liye ise saveVoucher() ke end mein renderHistoryTables() ke niche dalein
localStorage.setItem('vouchers', JSON.stringify(savedVouchers));


}

// Segmentation Engine rendering split tables
function renderHistoryTables() {
    const basahiBody = document.getElementById('basahiBody');
    const natwaBody = document.getElementById('natwaBody');
    basahiBody.innerHTML = '';
    natwaBody.innerHTML = '';

    savedVouchers.forEach(v => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><b>${v.vNo}</b></td>
            <td>${v.vDate}</td>
            <td><span style="padding:4px 8px; border-radius:4px; background:#ddd; font-weight:bold; font-size:12px;">${v.vType}</span></td>
            <td style="color:#2c3e50; font-size:13px;">${v.summary}</td>
            <td><b>₹${v.total.toFixed(2)}</b></td>
            <td><i>${v.narration}</i></td>
            <td>
                <button class="btn btn-edit" onclick="editVoucher('${v.id}')">Edit</button>
                <button class="btn btn-print" onclick="printVoucher('${v.id}')">Print</button>
                <button class="btn btn-delete" onclick="deleteVoucher('${v.id}')">Delete</button>
            </td>
        `;
        
        if (v.classification === "Basahi") {
            basahiBody.appendChild(tr);
        } else {
            natwaBody.appendChild(tr);
        }
    });
}

function deleteVoucher(id) {
    if(confirm("Kya aap delete karna chahte hain?")) {
        savedVouchers = savedVouchers.filter(v => v.id !== id);
        renderHistoryTables();
// Data delete hone ke baad storage update karne ke liye ise deleteVoucher() mein renderHistoryTables() ke niche dalein
localStorage.setItem('vouchers', JSON.stringify(savedVouchers));


    }
}

function editVoucher(id) {
    const voucher = savedVouchers.find(v => v.id === id);
    if(!voucher) return;

    editModeVoucherId = voucher.id;
    document.getElementById('voucherNo').value = voucher.vNo;
    document.getElementById('voucherDate').value = voucher.vDate;
    document.getElementById('voucherType').value = voucher.vType;
    document.getElementById('narration').value = voucher.narration;
    
    currentClassification = voucher.classification;
    const btn = document.getElementById('classificationBtn');
    btn.innerText = currentClassification;
    if(currentClassification === "Natwa") btn.classList.add('natwa'); else btn.classList.remove('natwa');

    const tbody = document.getElementById('entrySubBody');
    tbody.innerHTML = '';
    voucher.items.forEach(item => addGridRow(item.account, item.type, item.amount));
}

function printVoucher(id) {
    const voucher = savedVouchers.find(v => v.id === id);
    if(!voucher) return;

    let rowsHtml = '';
    voucher.items.forEach(item => {
        rowsHtml += `<tr><td style="border:1px solid #333; padding:8px;">${item.account}</td><td style="border:1px solid #333; padding:8px;">${item.type}</td><td style="border:1px solid #333; padding:8px; text-align:right;">₹${item.amount.toFixed(2)}</td></tr>`;
    });

    document.getElementById('printArea').innerHTML = `
        <div style="border:2px solid #333; padding:20px; font-family:Arial, sans-serif;">
            <div style="text-align:center; margin-bottom:20px;">
                <h2>ACCOUNT VOUCHER (${voucher.classification.toUpperCase()})</h2>
                <p style="font-weight:bold;">Type: ${voucher.vType}</p>
            </div>
            <hr>
            <table style="width:100%; margin:15px 0; border:none;">
                <tr style="border:none;"><td style="border:none;"><b>Voucher No:</b> ${voucher.vNo}</td><td style="text-align:right; border:none;"><b>Date:</b> ${voucher.vDate}</td></tr>
            </table>
            <table style="width:100%; border-collapse:collapse; margin-top:20px;">
                <thead><tr style="background:#f2f2f2;"><th style="border:1px solid #333; padding:8px; text-align:left;">Account Particulars</th><th style="border:1px solid #333; padding:8px; text-align:left;">Dr / Cr</th><th style="border:1px solid #333; padding:8px; text-align:right;">Amount</th></tr></thead>
                <tbody>${rowsHtml}<tr style="font-weight:bold;"><td colspan="2" style="border:1px solid #333; padding:8px; text-align:right;">Total Settlement Value:</td><td style="border:1px solid #333; padding:8px; text-align:right;">₹${voucher.total.toFixed(2)}</td></tr></tbody>
            </table>
            <p style="margin-top:20px;"><b>Narration:</b> <i>${voucher.narration || 'N/A'}</i></p>
        </div>
    `;
    window.print();
}
Const="https://script.google.com/macros/s/AKfycbzMLraZcirFbs-oOhgdwnXAoM3AYYNug-_Y5EAEZ9OIlEPGqAvW8CqeCPXXuty9h58W9w/exec"

</script>
</body>
</html>
