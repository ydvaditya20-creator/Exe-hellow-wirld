<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Sheet Live Editor</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f6f9; }
        h2 { color: #333; text-transform: capitalize; border-bottom: 2px solid #007bff; padding-bottom: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .loading { font-size: 18px; color: #666; font-style: italic; text-align: center; margin-top: 20px; }
        .error { color: red; font-weight: bold; }
        
        /* Action Buttons Styling */
        .action-buttons { display: flex; gap: 6px; }
        .btn { padding: 6px 12px; font-size: 13px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-edit { background-color: #ffc107; color: #212529; }
        .btn-save { background-color: #28a745; color: white; }
        .btn-delete { background-color: #dc3545; color: white; }
        
        /* Inline Input Fields Styling */
        .edit-input { width: 90%; padding: 6px; font-size: 14px; border: 1px solid #007bff; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h2 id="title">Loading Data...</h2>
    <div id="table-container" class="loading">Google Sheet se live data laya ja raha hai...</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sheetName = urlParams.get('sheet');
        
        // ⚠️ APNA GOOGLE APPS SCRIPT WEB APP URL YAHAN DAALEIN
        const webAppUrl = "https://script.google.com/macros/s/AKfycbzMLraZcirFbs-oOhgdwnXAoM3AYYNug-_Y5EAEZ9OIlEPGqAvW8CqeCPXXuty9h58W9w/exec"; 

        if (!sheetName) {
            document.getElementById('table-container').innerHTML = "<p class='error'>Error: URL me sheet parameter nahi mila!</p>";
        } else {
            document.getElementById('title').innerText = sheetName + " Table Editor";
            fetchData();
        }

        function fetchData() {
            fetch(`${webAppUrl}?sheet=${sheetName}`)
                .then(response => response.json())
                .then(data => {
                    if (data.length <= 1) {
                        document.getElementById('table-container').innerHTML = "<p class='error'>Is sheet me koi data nahi mila.</p>";
                        return;
                    }
                    buildTable(data);
                })
                .catch(error => {
                    document.getElementById('table-container').innerHTML = "<p class='error'>Data load karne me error aayi.</p>";
                });
        }

        function buildTable(data) {
            let htmlTable = "<table><tr id='header-row'>";
            
            // Header Generation (Last plain action drop karna)
            for (let j = 0; j < data[0].length - 1; j++) {
                htmlTable += `<th>${data[0][j]}</th>`;
            }
            htmlTable += "<th>Actions</th></tr>";
            
            // Data Rows Generation
            for (let i = 1; i < data.length; i++) {
                const voucherNo = data[i][0]; // Index 0 par Voucher No hai
                htmlTable += `<tr id="row-${i}">`;
                
                for (let j = 0; j < data[i].length - 1; j++) {
                    htmlTable += `<td class="cell-data">${data[i][j]}</td>`;
                }
                
                // Edit aur Delete Buttons
                // Dynamic Buttons Injection (Pehle wale code me sirf Edit aur Delete tha, ab Print bhi hai)
htmlTable += `
    <td>
        <div class="action-buttons">
            <button class="btn btn-edit" id="btn-edit-${i}" onclick="toggleEdit(${i}, '${voucherNo}')">✏️ Edit</button>
            <button class="btn btn-print" onclick="printVoucher('${voucherNo}')">🖨️ Print</button>
            <button class="btn btn-delete" id="btn-del-${i}" onclick="deleteVoucher('${voucherNo}')">🗑️ Delete</button>
        </div>
    </td>
`;

                htmlTable += "</tr>";
            }
            
            htmlTable += "</table>";
            const container = document.getElementById('table-container');
            container.classList.remove('loading');
            container.innerHTML = htmlTable;
        }

        // ---- INLINE EDIT TOOGLE LOGIC ----
        function toggleEdit(rowIndex, voucherNo) {
            const tr = document.getElementById(`row-${rowIndex}`);
            const cells = tr.getElementsByClassName('cell-data');
            const editBtn = document.getElementById(`btn-edit-${rowIndex}`);
            
            if (editBtn.innerText === "✏️ Edit") {
                // --- EDIT MODE ACTIVATE ---
                editBtn.innerText = "💾 Save";
                editBtn.className = "btn btn-save";
                
                // Voucher No (Pehla cell j=0) ko locked rakhenge, baki editable honge
                for (let j = 1; j < cells.length; j++) {
                    const currentValue = cells[j].innerText;
                    cells[j].innerHTML = `<input type="text" class="edit-input" value="${currentValue}">`;
                }
            } else {
                // --- SAVE MODE TRIGGER ---
                const updatedRow = [voucherNo]; // Pehla data hamesha Voucher No hi rahega
                
                // Input boxes se nayi value nikalna
                for (let j = 1; j < cells.length; j++) {
                    const inputVal = cells[j].querySelector('input').value.trim();
                    updatedRow.push(inputVal);
                }
                
                // UI par loading display karna aur save function call karna
                editBtn.innerText = "⏳...";
                editBtn.disabled = true;
                saveUpdatedData(voucherNo, updatedRow);
            }
        }

        // ---- GOOGLE SHEET ME DATA SAVE (UPDATE) KARNA ----
        function saveUpdatedData(voucherNo, updatedRow) {
            fetch(webAppUrl, {
                method: "POST",
                mode: "no-cors",
                cache: "no-cache",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    action: "update",
                    sheetName: sheetName,
                    voucherNo: voucherNo,
                    updatedRow: updatedRow
                })
            })
            .then(() => {
                alert("Data kamyabi se update ho gaya!");
                fetchData(); // Table ko update ke baad auto fresh reload karna
            })
            .catch(error => {
                alert("Data save karne me dikkat aayi.");
                fetchData();
            });
        }

        // ---- GOOGLE SHEET SE ROW DELETE KARNA ----
        function deleteVoucher(voucherNo) {
            if (confirm(`Kya aap sach me Voucher No: ${voucherNo} ko hatana chahte hain?`)) {
                document.getElementById('table-container').innerHTML = "<div class='loading'>Deleting Row...</div>";
                fetch(webAppUrl, {
                    method: "POST",
                    mode: "no-cors",
                    cache: "no-cache",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        action: "delete",
                        sheetName: sheetName,
                        voucherNo: voucherNo
                    })
                })
                .then(() => {
                    alert("Voucher sheet se delete ho gaya!");
                    fetchData();
                })
                .catch(error => {
                    alert("Delete failed.");
                    fetchData();
                });
            }
        }
        function printVoucher(voucherNo) {
    // 1. Pehle us row ko dhoondhein jisme yeh voucher hai
    // Hum headers aur row cells dono ka data nikalenge
    const table = document.querySelector("table");
    const headers = Array.from(table.querySelectorAll("th")).map(th => th.innerText);
    const rows = Array.from(table.querySelectorAll("tr"));
    
    let targetRowCells = null;
    
    // Sahi row dhoondhna Voucher No match karke
    for(let i = 1; i < rows.length; i++) {
        const firstCellText = rows[i].cells[0].innerText.trim();
        if(firstCellText === voucherNo.trim()) {
            targetRowCells = Array.from(rows[i].cells).map(td => td.innerText);
            break;
        }
    }
    
    if(!targetRowCells) {
        alert("Voucher data nahi mila!");
        return;
    }

    // 2. Naya temporary window open karna print layout ke liye
    const printWindow = window.open("", "_blank", "width=800,height=600");
    
    // 3. Voucher ke liye ek clean receipt design (HTML) taiyar karna
    const voucherHtml = `
        <!DOCTYPE html>
        <html>
        <head>
            <title>Print Voucher - ${voucherNo}</title>
            <style>
                body { font-family: 'Courier New', Courier, monospace; padding: 30px; color: #000; }
                .receipt-box { border: 2px dashed #000; padding: 20px; max-width: 600px; margin: 0 auto; }
                .header { text-align: center; border-bottom: 1px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
                .header h2 { margin: 0; text-transform: uppercase; letter-spacing: 1px; }
                .row-item { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 15px; }
                .row-item .label { font-weight: bold; width: 40%; }
                .row-item .val { width: 60%; text-align: left; }
                .total { border-top: 1px solid #000; border-bottom: 1px solid #000; padding: 8px 0; font-weight: bold; font-size: 18px; margin-top: 20px; }
                .footer { text-align: center; margin-top: 40px; font-size: 12px; border-top: 1px dashed #ccc; padding-top: 10px; }
                @media print { button { display: none; } }
            </style>
        </head>
        <body>
            <div class="receipt-box">
                <div class="header">
                    <h2>VOUCHER RECEIPT</h2>
                    <p style="margin: 5px 0 0 0;">Official Record Slip</p>
                </div>
                
                <div class="row-item"><span class="label">${headers[0]}:</span> <span class="val">${targetRowCells[0]}</span></div>
                <div class="row-item"><span class="label">${headers[1]}:</span> <span class="val">${targetRowCells[1]}</span></div>
                <div class="row-item"><span class="label">${headers[2]}:</span> <span class="val">${targetRowCells[2]}</span></div>
                <div class="row-item"><span class="label">${headers[3]}:</span> <span class="val">${targetRowCells[3]}</span></div>
                
                <div class="row-item total">
                    <span class="label">${headers[4]}:</span> <span class="val">${targetRowCells[4]}</span>
                </div>
                
                <div class="row-item" style="margin-top: 15px;"><span class="label">${headers[5]}:</span> <span class="val">${targetRowCells[5]}</span></div>
                
                <div class="footer">
                    <p>Thank you! System Generated Copy</p>
                    <button onclick="window.print();" style="padding: 8px 15px; font-weight: bold; cursor: pointer; margin-top: 10px;">Click to Print / Save PDF</button>
                </div>
            </div>
            <script>
                // Page khulte hi auto print dialog box open karne ke liye
                window.onload = function() { window.print(); }
            <\/script>
        </body>
        </html>
    `;
    
    printWindow.document.write(voucherHtml);
    printWindow.document.close();
}
function formatDate(dateStr) {
    // Agar text me T aur Z hai (ISO format) tabhi format karein
    if (typeof dateStr === 'string' && dateStr.includes('T')) {
        const dateObj = new Date(dateStr);
        if (!isNaN(dateObj.getTime())) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            
            // Ab yeh date ko DD-MM-YYYY format me return karega (e.g., 14-09-2026)
            return `${day}-${month}-${year}`; 
        }
    }
    return dateStr; // Agar normal data hai toh waisa hi dikhega
}

    </script>
</body>
</html>
