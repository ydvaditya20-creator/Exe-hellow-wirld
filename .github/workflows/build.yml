name: Build Mobile Project to Windows EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: |
        npm install

    - name: Build Windows EXE
      run: |
        npm run build

    - name: Upload Windows Software
      uses: actions/upload-artifact@v4
      with:
        name: My-Windows-App
        path: dist/*.exe
